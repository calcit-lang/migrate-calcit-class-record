name: Upload

on:
  push:
    branches:
      - main
      - prepare/migrate-record-source031
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Set up Calcit and Caps
        uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: "0.1.1"

      - name: Resolve immutable dependencies
        run: |
          set -euo pipefail
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Validate Calcit upgrade
        run: |
          set -euo pipefail
          node prepare-source.mjs
          calcit edit format
          test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-blob.txt)"
          calcit calcit.cirru --check-only --all-defs --format json
          calcit calcit.cirru fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status? == "passed" and .diagnostics? == [] then true else ., false end'
          calcit calcit.cirru test --require-match --summary-only
          calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
          calcit calcit.cirru analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'

      - name: Select CDN asset path
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          fi
          base_url="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

      - name: Build web assets with CDN URLs
        run: |
          set -euo pipefail
          yarn compile
          yarn build

      - name: Skip superseded production deployment
        id: deploy-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=true
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            latest_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
            if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
              current=false
              echo "::notice::Skipping superseded production deployment; main HEAD has changed."
            fi
          fi
          echo "current=${current}" >> "$GITHUB_OUTPUT"

      - name: Check COS credentials
        id: cos-credentials
        if: steps.deploy-head.outputs.current == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "::warning title=COS upload skipped::Configure COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY to run public upload verification."
            else
              echo "::error title=COS credentials missing::COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY are required for production deployment."
              exit 1
            fi
          fi

      - name: Upload and verify static assets on COS
        if: steps.deploy-head.outputs.current == 'true' && steps.cos-credentials.outputs.available == 'true'
        uses: worktools/cos-upload-action@v1.2.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Deploy web assets
        if: steps.deploy-head.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: -avzr --progress
          options: ""
          ssh_options: ""
          src: dist/*
          dest: rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}

      - name: Display deployment status
        if: steps.deploy-head.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"

      - name: Preserve prepared source and original frontend
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migrate-record-source-prepared
          path: |
            calcit.cirru
            acceptance/
            js-out/
            dist/
          retention-days: 3
